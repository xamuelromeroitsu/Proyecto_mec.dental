<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaDent LAB - Laboratorio Dental Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          screens: {
            'xs': '400px',
            'sm': '640px',
            'md': '768px',
            'lg': '1024px',
            'xl': '1280px',
            '2xl': '1536px',
          },
        },
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .characterWrapper {
        display: flex;
        flex-direction: column;
        position: relative;
        align-items: center;
        justify-content: flex-end;
        overflow-x: hidden;
      }

      .muelaBody {
        height: fit-content;
        margin-bottom: 5px;
        animation: jump 0.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      @keyframes jump {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(-5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      .road {
        width: 100%;
        height: 4px;
        background-color: #1a2b48;
        position: relative;
        bottom: 0;
        align-self: flex-end;
        border-radius: 4px;
        overflow: hidden;
      }

      .road::before {
        content: "";
        position: absolute;
        width: 50px;
        height: 100%;
        background-color: #C5A059;
        right: -50%;
        border-radius: 3px;
        animation: roadAnimation 1.2s linear infinite;
      }

      @keyframes roadAnimation {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-200px); }
      }
    </style>
  </head>
  <body class="m-0 bg-[#f9f9f9]">
    <div id="root" class="flex justify-center items-center min-h-screen w-full" style="font-family: 'Inter', sans-serif;">
      <div class="loader px-4">
        <div class="characterWrapper w-[120px] h-[120px] xs:w-[150px] xs:h-[140px]">
          <div class="muelaBody w-[80px] xs:w-[100px]">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
              <path d="M55 55 C 40 20, 160 20, 145 55 C 160 70, 155 120, 150 140 C 130 160, 110 140, 100 140 C 90 140, 70 160, 50 140 C 45 120, 40 70, 55 55 Z" fill="#ffffff" stroke="#1a2b48" stroke-width="8" stroke-linejoin="round"/>
              <ellipse cx="80" cy="95" rx="9" ry="14" fill="#1a2b48" />
              <ellipse cx="120" cy="95" rx="9" ry="14" fill="#1a2b48" />
              <path d="M90 120 Q 100 132 110 120" stroke="#1a2b48" stroke-width="6" fill="none" stroke-linecap="round" />
            </svg>
          </div>
          <div class="road"></div>
        </div>
        <p class="text-[#1a2b48] font-bold text-lg xs:text-xl tracking-wider uppercase animate-pulse">Cargando...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
